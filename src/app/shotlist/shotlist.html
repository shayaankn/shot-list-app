<div class="max-w-6xl mx-auto">
  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-4 gap-2">
    <h2 class="text-stone-800 text-xl font-semibold">{{ projectName }}</h2>
    <div class="flex items-center">
      <a
        (click)="goBack($event)"
        class="bg-transparent hover:bg-stone-800 text-stone-800 hover:text-stone-100 border border-stone-800 hover:border-transparent rounded-md cursor-pointer px-4 py-2"
      >
        Back
      </a>
      <button
        (click)="addShot()"
        class="bg-stone-800 hover:bg-stone-700 text-stone-100 rounded-md cursor-pointer px-4 py-2 ml-2"
      >
        + Add Shot
      </button>
    </div>
  </div>

  <div class="overflow-x-auto">
    <div class="min-w-[900px]">
      <div class="border-b border-b-stone-300 flex items-start space-x-4 p-3">
        <div class="flex flex-col items-center w-8">
          <!-- space for checkbox/index column -->
        </div>

        <div class="flex-1 grid grid-cols-7 gap-3">
          <div>
            <div class="text-sm text-stone-600 font-semibold">Scene</div>
          </div>
          <div>
            <div class="text-sm text-stone-600 font-semibold">Shot</div>
          </div>
          <div class="col-span-2">
            <div class="text-sm text-stone-600 font-semibold">Description</div>
          </div>
          <div>
            <div class="text-sm text-stone-600 font-semibold">Lens</div>
          </div>
          <div>
            <div class="text-sm text-stone-600 font-semibold">Movement</div>
          </div>
          <div>
            <div class="text-sm text-stone-600 font-semibold">Time of Day</div>
          </div>
        </div>

        <div class="flex flex-col items-end w-12">
          <!-- space for actions column -->
        </div>
      </div>

      <div>
        <div
          *ngFor="let shot of shots; let i = index"
          class="flex items-start border-b border-b-stone-200 space-x-4 p-3"
          [class.opacity-25]="shot.completed"
        >
          <div class="flex flex-col self-center w-8">
            <input type="checkbox" [(ngModel)]="shot.completed" (change)="saveShots()" />
            <!-- <div class="text-xs text-gray-500 mt-2">#{{ i + 1 }}</div> -->
          </div>

          <div class="flex-1 grid grid-cols-7 gap-3">
            <div>
              <input
                [(ngModel)]="shot.scene"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-400 rounded-md w-full p-1"
              />
            </div>
            <div>
              <input
                [(ngModel)]="shot.shot"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-400 rounded-md w-full p-1"
              />
            </div>
            <div class="col-span-2">
              <input
                [(ngModel)]="shot.description"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-400 rounded-md w-full p-1"
              />
            </div>
            <div>
              <input
                [(ngModel)]="shot.lens"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-400 rounded-md w-full p-1"
              />
            </div>
            <div>
              <input
                [(ngModel)]="shot.movement"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-400 rounded-md w-full p-1"
              />
            </div>
            <div>
              <input
                [(ngModel)]="shot.timeOfDay"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-400 rounded-md w-full p-1"
              />
            </div>
          </div>

          <div class="flex flex-col self-center items-end space-y-2 w-12">
            <button (click)="removeShot(i)" class="text-sm text-red-600 hover:underline cursor-pointer">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="shots.length === 0" class="text-sm text-center text-gray-500 mt-6">
    No shots yet — add one.
  </div>
</div>

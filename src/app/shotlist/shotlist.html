<div class="max-w-6xl mx-auto">
  <div class="flex flex-row flex-wrap justify-between items-center mb-4 gap-2">
    <h2 class="text-stone-800 text-xl font-semibold">{{ projectName }}</h2>
    <div class="flex items-center">
      <a
        (click)="goBack($event)"
        class="bg-stone-50 hover:bg-stone-100 text-stone-800 border border-stone-300 rounded-md cursor-pointer px-4 py-2"
      >
        Back
      </a>
      <button
        (click)="addShot()"
        class="bg-rose-600 hover:bg-rose-700 text-stone-50 rounded-md cursor-pointer px-4 py-2 ml-2"
      >
        + Add Shot
      </button>
    </div>
  </div>

  <div class="overflow-x-auto">
    <div class="min-w-[900px]">
      <div class="border-b border-b-stone-300 flex items-start space-x-4 p-3">
        <!-- grip column header -->
        <div class="flex flex-col items-center w-2"></div>

        <div class="flex flex-col items-center w-6">
          <!-- space for checkbox/index column -->
        </div>

        <div class="flex-1 grid grid-cols-7 gap-3">
          <div>
            <div class="text-sm text-stone-500 font-semibold">Image</div>
          </div>
          <div>
            <div class="text-sm text-stone-500 font-semibold">Scene</div>
          </div>
          <div>
            <div class="text-sm text-stone-500 font-semibold">Shot</div>
          </div>
          <div class="col-span-2">
            <div class="text-sm text-stone-500 font-semibold">Description</div>
          </div>
          <div>
            <div class="text-sm text-stone-500 font-semibold">Lens</div>
          </div>
          <div>
            <div class="text-sm text-stone-500 font-semibold">Movement</div>
          </div>
        </div>

        <div class="flex flex-col items-end w-12">
          <!-- space for actions column -->
        </div>
      </div>

      <div cdkDropList (cdkDropListDropped)="drop($event)">
        <div
          *ngFor="let shot of shots; let i = index"
          cdkDrag
          class="flex items-start border-b border-b-stone-200 space-x-4 p-3"
          [class.opacity-25]="shot.completed"
        >
          <!-- grip handle column -->
          <div class="flex flex-col items-center self-center w-2">
            <i
              class="bi bi-grip-vertical text-stone-400 hover:text-stone-600 cursor-grab"
              cdkDragHandle
              aria-hidden="true"
              title="Drag to reorder"
            ></i>
          </div>

          <div class="flex flex-col self-center w-6">
            <input type="checkbox" [(ngModel)]="shot.completed" (change)="saveShots()" />
            <!-- <div class="text-xs text-gray-500 mt-2">#{{ i + 1 }}</div> -->
          </div>

          <div class="flex-1 grid grid-cols-7 gap-3">
            <div>
              <div
                class="w-22 lg:w-26 xl:w-28 h-20 bg-stone-100 border border-stone-200 rounded-md overflow-hidden relative flex items-center justify-center"
              >
                <img *ngIf="shot.image" [src]="shot.image" class="object-cover w-full h-full" />
                <div *ngIf="!shot.image" class="text-xs text-stone-500">No image</div>

                <input
                  type="file"
                  accept="image/*"
                  (change)="onImageSelected($event, i)"
                  class="absolute inset-0 opacity-0 cursor-pointer"
                />

                <button
                  *ngIf="shot.image"
                  (click)="removeImage(i)"
                  class="absolute bottom-1 right-1 text-stone-50 hover:text-rose-300 text-sm rounded cursor-pointer px-1.5"
                  style="background-color: rgba(0, 0, 0, 0.25)"
                  type="button"
                >
                  ×
                </button>
              </div>
            </div>
            <div class="self-center">
              <input
                [(ngModel)]="shot.scene"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-300 rounded-md w-full p-1"
              />
            </div>
            <div class="self-center">
              <input
                [(ngModel)]="shot.shot"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-300 rounded-md w-full p-1"
              />
            </div>
            <div class="col-span-2 self-center">
              <input
                [(ngModel)]="shot.description"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-300 rounded-md w-full p-1"
              />
            </div>
            <div class="self-center">
              <input
                [(ngModel)]="shot.lens"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-300 rounded-md w-full p-1"
              />
            </div>
            <div class="self-center">
              <input
                [(ngModel)]="shot.movement"
                (ngModelChange)="saveShots()"
                class="text-sm text-stone-800 border border-stone-200 hover:border-stone-300 rounded-md w-full p-1"
              />
            </div>
          </div>

          <div class="flex flex-col self-center items-end space-y-2 w-12">
            <button
              (click)="removeShot(i)"
              class="text-sm text-rose-600 hover:underline cursor-pointer"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="shots.length === 0" class="text-sm text-center text-gray-500 mt-6">
    No shots yet — add one.
  </div>
</div>
